name: Build Gomi Desktop EXE

run-name: Gomi Desktop EXE ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish the built installer to a GitHub release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: gomi-desktop-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Gomi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate branded desktop assets
        run: npm run generate:brand-assets

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build webview bundle
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Checksum installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release\desktop -Filter 'Gomi-IDE-Setup-*.exe' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw 'No Gomi IDE Windows installer was produced by electron-builder.'
          }

          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path release\desktop\GOMI-IDE-SHA256SUMS.txt -Encoding UTF8
          Write-Host "Built $($installer.Name) ($([Math]::Round($installer.Length / 1MB, 2)) MB)"
          Write-Host "SHA256 $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gomi-ide-windows-installer
          path: |
            release/desktop/Gomi-IDE-Setup-*.exe
            release/desktop/GOMI-IDE-SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-{0}', github.run_number) }}
          name: Gomi IDE ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-{0}', github.run_number) }}
          draft: false
          prerelease: true
          files: |
            release/desktop/Gomi-IDE-Setup-*.exe
            release/desktop/GOMI-IDE-SHA256SUMS.txt
